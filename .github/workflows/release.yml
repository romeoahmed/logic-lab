name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed Git tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  APPLICATION_DEPLOYMENT: application-${{ github.run_id }}-${{ github.run_attempt }}
  APPLICATION_PARAMETERS_FILE: infra/application.production.bicepparam
  AZURE_CORE_OUTPUT: none
  BICEP_VERSION: 0.46.1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  FOUNDATION_DEPLOYMENT: foundation-${{ github.run_id }}-${{ github.run_attempt }}
  FOUNDATION_PARAMETERS_FILE: infra/foundation.production.bicepparam
  JOBS_DEPLOYMENT: jobs-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Release to production
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    environment: production
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf 'Release tag must be a v-prefixed semantic version.\n' >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            printf '%s must resolve to an existing Git tag.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            printf 'Checked-out commit does not match %s.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "${RELEASE_TAG#v}"
            printf 'commit=%s\n' "$tag_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/LogicLab.DatabaseMigrator/packages.lock.json
            src/LogicLab.Web/packages.lock.json

      - name: Restore production projects
        run: |
          dotnet restore src/LogicLab.Web/LogicLab.Web.csproj --runtime linux-x64 --locked-mode --nologo
          dotnet restore src/LogicLab.DatabaseMigrator/LogicLab.DatabaseMigrator.csproj --runtime linux-x64 --locked-mode --nologo

      - name: Install Bicep CLI
        run: az bicep install --version "v$BICEP_VERSION"

      - name: Compile infrastructure
        run: |
          az bicep build --file infra/foundation.bicep --outfile "$RUNNER_TEMP/foundation.json"
          az bicep build --file infra/application.bicep --outfile "$RUNNER_TEMP/application.json"

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate foundation
        uses: azure/bicep-deploy@v2
        env: &foundation_parameters
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ secrets.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          CONTAINER_REGISTRY_SKU_NAME: ${{ vars.CONTAINER_REGISTRY_SKU_NAME }}
          POSTGRES_BACKUP_RETENTION_DAYS: ${{ vars.POSTGRES_BACKUP_RETENTION_DAYS }}
          POSTGRES_GEO_REDUNDANT_BACKUP: ${{ vars.POSTGRES_GEO_REDUNDANT_BACKUP }}
          POSTGRES_HIGH_AVAILABILITY: ${{ vars.POSTGRES_HIGH_AVAILABILITY }}
          POSTGRES_MAINTENANCE_DAY: ${{ vars.POSTGRES_MAINTENANCE_DAY }}
          POSTGRES_MAINTENANCE_HOUR: ${{ vars.POSTGRES_MAINTENANCE_HOUR }}
          POSTGRES_SKU_NAME: ${{ vars.POSTGRES_SKU_NAME }}
          POSTGRES_STORAGE_SIZE_GB: ${{ vars.POSTGRES_STORAGE_SIZE_GB }}
          POSTGRES_TIER: ${{ vars.POSTGRES_TIER }}
        with:
          type: deployment
          operation: validate
          name: ${{ env.FOUNDATION_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.FOUNDATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}

      - name: Preview foundation
        uses: azure/bicep-deploy@v2
        env: *foundation_parameters
        with:
          type: deployment
          operation: whatIf
          name: ${{ env.FOUNDATION_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.FOUNDATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}

      - name: Deploy foundation
        id: foundation
        uses: azure/bicep-deploy@v2
        env: *foundation_parameters
        with:
          type: deployment
          operation: create
          name: ${{ env.FOUNDATION_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.FOUNDATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}
          masked-outputs: containerRegistryName,containerRegistryLoginServer,logAnalyticsWorkspaceCustomerId,postgresServerName

      - name: Sign in to Azure Container Registry
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.containerRegistryName }}
        run: az acr login --name "$REGISTRY_NAME" --output none

      - name: Publish immutable OCI images
        env:
          REGISTRY_SERVER: ${{ steps.foundation.outputs.containerRegistryLoginServer }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dotnet publish src/LogicLab.Web/LogicLab.Web.csproj \
            --configuration Release \
            --os linux \
            --arch x64 \
            --no-restore \
            --nologo \
            /t:PublishContainer \
            -p:ContainerRegistry="$REGISTRY_SERVER" \
            -p:ContainerImageTag="$RELEASE_TAG" \
            -p:ContinuousIntegrationBuild=true \
            -p:Version="$VERSION"
          dotnet publish src/LogicLab.DatabaseMigrator/LogicLab.DatabaseMigrator.csproj \
            --configuration Release \
            --os linux \
            --arch x64 \
            --no-restore \
            --nologo \
            /t:PublishContainer \
            -p:ContainerRegistry="$REGISTRY_SERVER" \
            -p:ContainerImageTag="$RELEASE_TAG" \
            -p:ContinuousIntegrationBuild=true \
            -p:Version="$VERSION"

      - name: Resolve image digests
        id: images
        shell: bash
        env:
          REGISTRY_NAME: ${{ steps.foundation.outputs.containerRegistryName }}
          REGISTRY_SERVER: ${{ steps.foundation.outputs.containerRegistryLoginServer }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          web_digest="$(az acr repository show --name "$REGISTRY_NAME" --image "logic-lab-web:$RELEASE_TAG" --query digest --output tsv)"
          migrator_digest="$(az acr repository show --name "$REGISTRY_NAME" --image "logic-lab-migrator:$RELEASE_TAG" --query digest --output tsv)"
          if [[ ! "$web_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$migrator_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'ACR did not return valid OCI digests.\n' >&2
            exit 1
          fi

          {
            printf 'web_digest=%s\n' "$web_digest"
            printf 'web_image=%s/logic-lab-web@%s\n' "$REGISTRY_SERVER" "$web_digest"
            printf 'web_subject=%s/logic-lab-web\n' "$REGISTRY_SERVER"
            printf 'migrator_digest=%s\n' "$migrator_digest"
            printf 'migrator_image=%s/logic-lab-migrator@%s\n' "$REGISTRY_SERVER" "$migrator_digest"
            printf 'migrator_subject=%s/logic-lab-migrator\n' "$REGISTRY_SERVER"
          } >> "$GITHUB_OUTPUT"

      - name: Record release evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          MIGRATOR_IMAGE: ${{ steps.images.outputs.migrator_image }}
        run: |
          set -euo pipefail

          mkdir -p release-evidence
          cp "$RUNNER_TEMP/foundation.json" release-evidence/foundation.json
          cp "$RUNNER_TEMP/application.json" release-evidence/application.json
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg webImage "$WEB_IMAGE" \
            --arg migratorImage "$MIGRATOR_IMAGE" \
            '{repository: $repository, tag: $tag, commit: $commit, webImage: $webImage, migratorImage: $migratorImage}' \
            > release-evidence/release-manifest.json

      - name: Prepare SBOM output
        run: mkdir -p sbom

      - name: Generate Web SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.web_image }}
          output-file: sbom/logic-lab-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate migrator SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.migrator_image }}
          output-file: sbom/logic-lab-migrator.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ steps.release.outputs.tag }}
          path: |
            release-evidence/
            sbom/*.spdx.json
            **/packages.lock.json
            Directory.Packages.props
            global.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest Web provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.web_subject }}
          subject-digest: ${{ steps.images.outputs.web_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Web SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.web_subject }}
          subject-digest: ${{ steps.images.outputs.web_digest }}
          sbom-path: sbom/logic-lab-web.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest migrator provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.migrator_subject }}
          subject-digest: ${{ steps.images.outputs.migrator_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest migrator SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.migrator_subject }}
          subject-digest: ${{ steps.images.outputs.migrator_digest }}
          sbom-path: sbom/logic-lab-migrator.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Validate application
        uses: azure/bicep-deploy@v2
        env: &application_parameters
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          DEPLOY_WEB: "true"
          MIGRATOR_IMAGE: ${{ steps.images.outputs.migrator_image }}
          POSTGRES_SERVER_NAME: ${{ secrets.POSTGRES_SERVER_OVERRIDE || steps.foundation.outputs.postgresServerName }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          WEB_MAX_REPLICAS: ${{ vars.WEB_MAX_REPLICAS }}
          WEB_MIN_REPLICAS: ${{ vars.WEB_MIN_REPLICAS }}
        with:
          type: deployment
          operation: validate
          name: ${{ env.APPLICATION_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.APPLICATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}

      - name: Preview application
        uses: azure/bicep-deploy@v2
        env: *application_parameters
        with:
          type: deployment
          operation: whatIf
          name: ${{ env.APPLICATION_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.APPLICATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}

      - name: Deploy migration jobs
        id: jobs
        uses: azure/bicep-deploy@v2
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          DEPLOY_WEB: "false"
          MIGRATOR_IMAGE: ${{ steps.images.outputs.migrator_image }}
          POSTGRES_SERVER_NAME: ${{ secrets.POSTGRES_SERVER_OVERRIDE || steps.foundation.outputs.postgresServerName }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          WEB_MAX_REPLICAS: ${{ vars.WEB_MAX_REPLICAS }}
          WEB_MIN_REPLICAS: ${{ vars.WEB_MIN_REPLICAS }}
        with:
          type: deployment
          operation: create
          name: ${{ env.JOBS_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.APPLICATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}
          masked-outputs: bootstrapJobName,migrationJobName

      - name: Record pre-migration restore point
        shell: bash
        run: |
          set -euo pipefail

          restore_point="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            printf '## Database recovery boundary\n\n'
            printf -- "- Pre-migration PITR point: \`%s\`\n" "$restore_point"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bootstrap and migrate database
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          BOOTSTRAP_JOB: ${{ steps.jobs.outputs.bootstrapJobName }}
          LOG_ANALYTICS_WORKSPACE_ID: ${{ steps.foundation.outputs.logAnalyticsWorkspaceCustomerId }}
          MIGRATION_JOB: ${{ steps.jobs.outputs.migrationJobName }}
        run: bash .github/scripts/run-database-jobs.sh

      - name: Deploy Web revision
        id: application
        uses: azure/bicep-deploy@v2
        env: *application_parameters
        with:
          type: deployment
          operation: create
          name: ${{ env.APPLICATION_DEPLOYMENT }}
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          parameters-file: ${{ env.APPLICATION_PARAMETERS_FILE }}
          bicep-version: ${{ env.BICEP_VERSION }}

      - name: Verify readiness and stability
        shell: bash
        env:
          WEB_FQDN: ${{ steps.application.outputs.webFqdn }}
        run: |
          set -euo pipefail

          if [[ -z "$WEB_FQDN" ]]; then
            printf 'Application deployment did not return a Web FQDN.\n' >&2
            exit 1
          fi

          for ((attempt = 1; attempt <= 60; attempt++)); do
            if curl --fail --silent --show-error --max-time 10 "https://$WEB_FQDN/health/ready" >/dev/null; then
              for _ in 1 2 3; do
                sleep 10
                curl --fail --silent --show-error --max-time 10 "https://$WEB_FQDN/health/ready" >/dev/null
              done
              exit 0
            fi
            sleep 10
          done

          printf 'Web readiness did not succeed within ten minutes.\n' >&2
          exit 1

      - name: Record release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          MIGRATOR_IMAGE: ${{ steps.images.outputs.migrator_image }}
          WEB_FQDN: ${{ steps.application.outputs.webFqdn }}
        run: |
          set -euo pipefail

          {
            printf '## Logic Lab production release\n\n'
            printf -- "- Version: \`%s\`\n" "$RELEASE_TAG"
            printf -- "- Commit: \`%s\`\n" "$RELEASE_COMMIT"
            printf -- "- Web: \`%s\`\n" "$WEB_IMAGE"
            printf -- "- Migrator: \`%s\`\n" "$MIGRATOR_IMAGE"
            printf -- '- Endpoint: https://%s\n' "$WEB_FQDN"
          } >> "$GITHUB_STEP_SUMMARY"
