name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Restore production dependencies
        run: dotnet restore logic-lab.slnx --locked-mode --nologo

      - name: Build production code
        run: |
          dotnet build src/LogicLab.Web/LogicLab.Web.csproj --configuration Release --no-restore --nologo
          dotnet build src/LogicLab.DatabaseMigrator/LogicLab.DatabaseMigrator.csproj --configuration Release --no-restore --nologo

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
